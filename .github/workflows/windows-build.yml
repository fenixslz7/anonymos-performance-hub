name: Windows desktop build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run test suite
        run: bun run test
      - name: Build Windows installer
        run: bun run build:desktop
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: anonymos-performance-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

name: Build Minecraft private server plugin

on:
  push:
    paths:
      - "minecraft-private-server-plugin/**"
      - ".github/workflows/minecraft-plugin.yml"
  pull_request:
    paths:
      - "minecraft-private-server-plugin/**"
      - ".github/workflows/minecraft-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --file minecraft-private-server-plugin/pom.xml clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ANONYMOS-Private-Reach-1.8.9
          path: minecraft-private-server-plugin/target/ANONYMOS-Private-Reach-1.8.9.jar
          if-no-files-found: error
